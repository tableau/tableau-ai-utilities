name: Open public source pull request

# A push to main on git.soma overlays that commit onto
# tableau/tableau-ai-utilities and opens or updates the from-soma-main pull
# request. Merging the pull request is what publishes public gh-pages.
# git.soma Actions are off for this org until an admin enables them and stores
# PUBLIC_GITHUB_TOKEN. Until then, run `npm run publish:public` from site/.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish-public:
    if: github.server_url == 'https://git.soma.salesforce.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Open or update the public pull request
        env:
          PUBLIC_GITHUB_TOKEN: ${{ secrets.PUBLIC_GITHUB_TOKEN }}
        run: node scripts/run-tsx.cjs scripts/publish-public.ts
